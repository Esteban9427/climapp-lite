openapi: 3.1.0
info:
  title: ClimApp Lite API
  version: 0.1.0
  description: >
    Pronóstico de lluvia ≥20 mm para mañana en la cuenca del río Pance y reportes
    ciudadanos verificados. No es una alerta oficial.
paths:
  /forecast:
    get:
      summary: Pronóstico vigente para mañana
      parameters:
        - name: replay_date
          in: query
          description: Fecha de emisión para reproducción histórica (solo demo).
          schema: {type: string, format: date}
        - name: variant
          in: query
          description: >
            Variante del modelo (ADR-001 §3). Por defecto, `operativa`, también con
            `replay_date` (desde el 2026-11-01). `historica` solo existe en reproducción: sin
            `replay_date` responde 422.
          schema: {$ref: "#/components/schemas/Variant"}
      responses:
        "200":
          description: Pronóstico
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Forecast"}
        "422":
          description: Variante histórica pedida fuera de la reproducción, o parámetros inválidos
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: No hay pronóstico calculado
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /reports:
    post:
      summary: Enviar un reporte ciudadano (verificación asíncrona)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/ReportIn"}
      responses:
        "202":
          description: Reporte recibido; estado inicial "verificando"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Report"}
        "422":
          description: Entrada inválida (sin texto ni foto, foto > 5 MB, tipo no permitido)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: Falta el polígono de la cuenca (`sin_poligono`); no se puede decidir si el reporte está dentro
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    get:
      summary: Listar reportes (para el mapa y la lista)
      description: >
        Solo campos estructurados: tipo de evento, intensidad, hora observada, ubicación
        redondeada, estado y confianza. Sin `id` ni `claims`: las afirmaciones solo se ven en
        `GET /reports/{id}`, que conoce quien envió el reporte (UUID4, no adivinable).
      parameters:
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/ReportStatus"}
        - name: from
          in: query
          schema: {type: string, format: date}
        - name: to
          in: query
          schema: {type: string, format: date}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        "200":
          description: Reportes
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ReportSummary"}
        "422":
          description: Parámetros inválidos
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /reports/{id}:
    get:
      summary: Estado de un reporte
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Reporte
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Report"}
        "404":
          description: No existe
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /evaluation:
    get:
      summary: Evaluación del modelo frente a las líneas base en el periodo apartado
      parameters:
        - name: target_rule
          in: query
          schema: {$ref: "#/components/schemas/TargetRule"}
      responses:
        "200":
          description: Métricas
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EvaluationReport"}
        "422":
          description: Regla de objetivo no evaluada (las alternativas son Should, TASK-032)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: No hay evaluación calculada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
components:
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    TargetRule:
      type: string
      enum: [any_station, basin_mean, reference_station]
      default: basin_mean
    Variant:
      type: string
      description: >
        operativa = solo variables disponibles al día siguiente (estaciones; IMERG Early con
        TASK-028), la que se publica en vivo; historica = agrega CHIRPS (semanas de retraso),
        solo para la reproducción histórica.
      enum: [operativa, historica]
    DataPlan:
      type: string
      description: principal = estaciones + IMERG Early + CHIRPS; plan_b_earthdata = sin IMERG en el modelo; plan_b_datos = sin estaciones (D-03).
      enum: [principal, plan_b_earthdata, plan_b_datos]
    ReportStatus:
      type: string
      enum: [verificando, verificado, rechazado, requiere_revision_humana]
    Forecast:
      type: object
      required: [issued_at, target_date, prob_ge_threshold, threshold_mm, target_rule, data_plan, variant, model_version, explanation_fallback, stale, replay, disclaimer, official_channels_url]
      properties:
        issued_at: {type: string, format: date-time}
        target_date: {type: string, format: date}
        prob_ge_threshold: {type: number, minimum: 0, maximum: 1}
        threshold_mm: {type: number}
        target_rule: {$ref: "#/components/schemas/TargetRule"}
        accum_3d_mm: {type: [number, "null"]}
        accum_3d_level: {type: string, enum: [normal, elevado], description: "Indicador de SP-4 (≥ ACCUM3_THRESHOLD_MM); la web ya no lo muestra (2026-11-01)"}
        accum_3d_percentile: {type: [integer, "null"], minimum: 0, maximum: 100, description: "% de emisiones del entrenamiento (TRAIN_START..VALID_END) con un acumulado de 3 días menor (ADR-001 §11)"}
        climatology_prob: {type: [number, "null"], minimum: 0, maximum: 1, description: "Frecuencia del evento en el entrenamiento ±CLIMATOLOGY_WINDOW_DAYS alrededor del día objetivo"}
        decision_threshold: {type: [number, "null"], minimum: 0, maximum: 1, description: "Umbral de aviso del RF calibrado de la variante, fijado fuera de la prueba"}
        risk: {type: [string, "null"], enum: [elevado, habitual, null], description: "elevado si prob_ge_threshold ≥ decision_threshold (calculado por código)"}
        data_plan: {$ref: "#/components/schemas/DataPlan"}
        variant: {$ref: "#/components/schemas/Variant"}
        model_version: {type: string}
        explanation: {type: [string, "null"]}
        explanation_fallback: {type: boolean, description: "true si la explicación viene de respuestas grabadas (DEMO_FALLBACK=1, ADR-002 §5)"}
        inputs_available:
          type: array
          items: {type: string}
        stale: {type: boolean}
        replay: {type: boolean}
        disclaimer: {type: string}
        official_channels_url: {type: string, format: uri}
    ReportIn:
      type: object
      required: [lat, lon]
      properties:
        text: {type: string, minLength: 1, maxLength: 1000}
        photo: {type: string, format: binary}
        lat: {type: number}
        lon: {type: number}
        observed_at: {type: string, format: date-time}
    ReportStructured:
      type: object
      required: [event_type, intensity, observed_at, claims, numbers_cited]
      properties:
        event_type: {type: string, enum: [lluvia, crecida, deslizamiento, granizo, sin_lluvia, otro]}
        intensity: {type: string, enum: [ninguna, debil, moderada, fuerte]}
        observed_at: {type: string, format: date-time}
        claims:
          type: array
          items: {type: string}
        numbers_cited:
          type: array
          items: {type: number}
    VerificationAttempt:
      type: object
      required: [n, passed, reasons, finish_reason, tokens_in, tokens_out, latency_ms]
      properties:
        n: {type: integer, minimum: 1, maximum: 3}
        passed: {type: boolean}
        reasons:
          type: array
          items:
            type: string
            enum: [respuesta_incompleta, respuesta_vacia, esquema_invalido, cifra_no_coincide, dato_personal, herramienta_no_permitida, afirmacion_sin_evidencia]
        finish_reason: {type: string}
        tokens_in: {type: integer}
        tokens_out: {type: integer}
        latency_ms: {type: integer}
    ConfidenceSource:
      type: object
      required: [source_id, kind, members, agrees, weight]
      properties:
        source_id: {type: string}
        kind: {type: string, enum: [station_group, satellite, forecast, river_level]}
        members:
          type: array
          items: {type: string}
        agrees: {type: boolean}
        weight: {type: number}
    Confidence:
      type: object
      required: [score, sources, independent_sources]
      properties:
        score: {type: number, minimum: 0, maximum: 1}
        sources:
          type: array
          items: {$ref: "#/components/schemas/ConfidenceSource"}
        independent_sources: {type: integer}
    ReportSummary:
      type: object
      description: Reporte para la lista y el mapa, sin id, texto ni afirmaciones (privacidad).
      required: [event_type, intensity, observed_at, lat, lon, status, confidence, fallback]
      additionalProperties: false
      properties:
        event_type: {type: [string, "null"], enum: [lluvia, crecida, deslizamiento, granizo, sin_lluvia, otro, null]}
        intensity: {type: [string, "null"], enum: [ninguna, debil, moderada, fuerte, null]}
        observed_at: {type: [string, "null"], format: date-time}
        lat: {type: number}
        lon: {type: number}
        status: {$ref: "#/components/schemas/ReportStatus"}
        confidence:
          oneOf:
            - {$ref: "#/components/schemas/Confidence"}
            - {type: "null"}
        fallback: {type: boolean}
    Report:
      type: object
      description: Detalle de un reporte (`POST /reports` y `GET /reports/{id}`), con sus afirmaciones.
      required: [id, received_at, lat, lon, status, attempts, fallback]
      properties:
        id: {type: string, format: uuid}
        received_at: {type: string, format: date-time}
        lat: {type: number}
        lon: {type: number}
        status: {$ref: "#/components/schemas/ReportStatus"}
        reject_reason: {type: [string, "null"], enum: [fuera_de_cuenca, entrada_invalida, null]}
        review_reason:
          type: [string, "null"]
          description: Por qué quedó en `requiere_revision_humana` sin pasar por la compuerta (null si la compuerta corrió).
          enum: [solo_foto, muse_no_disponible, sin_grabacion, null]
        structured:
          oneOf:
            - {$ref: "#/components/schemas/ReportStructured"}
            - {type: "null"}
        confidence:
          oneOf:
            - {$ref: "#/components/schemas/Confidence"}
            - {type: "null"}
        attempts:
          type: array
          items: {$ref: "#/components/schemas/VerificationAttempt"}
        fallback: {type: boolean}
        duplicate: {type: boolean, description: "true si el mismo texto llegó en menos de DUPLICATE_WINDOW_MIN: se devuelve el reporte anterior y no se guarda otro (2026-11-01)"}
    ModelMetrics:
      type: object
      required: [name, pod, far, csi, brier, auc]
      properties:
        name: {type: string, enum: [rf, climatology, persistence]}
        variant:
          description: Solo para rf.
          oneOf:
            - {$ref: "#/components/schemas/Variant"}
            - {type: "null"}
        calibrated: {type: [boolean, "null"], description: "Solo para rf: isotónica fuera de muestra (ADR-001 §1)."}
        available_live: {type: [boolean, "null"], description: "Solo para rf: false si usa datos con retraso."}
        note: {type: [string, "null"]}
        threshold: {type: number, description: Umbral de decisión fijado fuera de la prueba.}
        n_days: {type: integer}
        excluded_imputed_days: {type: integer}
        pod: {type: number}
        far: {type: number}
        csi: {type: number}
        brier: {type: number}
        auc: {type: number}
        reliability:
          type: array
          items:
            type: object
            properties:
              bin: {type: string}
              forecast: {type: number}
              observed: {type: number}
              n: {type: integer}
    EvaluationReport:
      type: object
      required: [test_period, target_rule, threshold_mm, data_plan, scenarios, daily, excluded_imputed_days]
      properties:
        test_period:
          type: object
          properties:
            start: {type: string, format: date}
            end: {type: string, format: date}
        target_rule: {$ref: "#/components/schemas/TargetRule"}
        threshold_mm: {type: number}
        data_plan: {$ref: "#/components/schemas/DataPlan"}
        scenarios:
          type: object
          description: Métricas con y sin EST-B (deja de reportar el 2026-07-07).
          required: [con_est_b, sin_est_b]
          properties:
            con_est_b:
              type: array
              items: {$ref: "#/components/schemas/ModelMetrics"}
            sin_est_b:
              type: array
              items: {$ref: "#/components/schemas/ModelMetrics"}
        sensitivity:
          type: [array, "null"]
          description: "[Should] Umbrales 10/20/50 mm y reglas de objetivo alternativas."
          items:
            type: object
            properties:
              threshold_mm: {type: number}
              target_rule: {$ref: "#/components/schemas/TargetRule"}
              event_frequency: {type: number}
              rf_auc: {type: number}
              rf_brier: {type: number}
              climatology_brier: {type: number}
        imerg_final_vs_early:
          description: "[Should] Contraste Early↔Final."
          type: [object, "null"]
          properties:
            period: {type: string}
            bias_mm: {type: number}
            pearson_r: {type: number}
            n_days: {type: integer}
        daily:
          type: array
          items:
            type: object
            properties:
              date: {type: string, format: date}
              prob: {type: number}
              observed: {type: [boolean, "null"]}
              outcome: {type: string, enum: [acierto, falsa_alarma, fallo, correcto_negativo]}
        daily_variant:
          description: Variante del RF (calibrado) con la que se calcula `daily`.
          allOf: [{$ref: "#/components/schemas/Variant"}]
        excluded_imputed_days: {type: integer}
        report_verification:
          description: >-
            Evaluación de la compuerta de reportes con Muse real sobre el set simulado de
            eval-harness (TASK-021, TASK-036). `null` si no hay resumen o está corrupto.
          anyOf:
            - {$ref: "#/components/schemas/ReportVerificationEval"}
            - {type: "null"}
    ReportEvalRates:
      type: object
      required: [n, pass_at_1, within_3, human_review, mean_attempts, cost_usd, latency_p50_s, latency_p95_s]
      properties:
        n: {type: integer, minimum: 1}
        pass_at_1: {type: number, minimum: 0, maximum: 1, description: Acierto con un solo intento}
        within_3: {type: number, minimum: 0, maximum: 1, description: Acierto dentro de VERIFY_MAX_ATTEMPTS}
        human_review: {type: number, minimum: 0, maximum: 1, description: Fracción a revisión humana}
        mean_attempts: {type: number, minimum: 0}
        cost_usd: {type: number, minimum: 0, description: Costo total del grupo}
        latency_p50_s: {type: number, minimum: 0, description: Por reporte (suma de sus intentos)}
        latency_p95_s: {type: number, minimum: 0}
    ReportEvalRun:
      type: object
      required: [run, effort_structure, effort_judge, total, by_label, by_class, matrix]
      properties:
        run: {type: string}
        effort_structure: {type: string, enum: [low, medium, high]}
        effort_judge: {type: string, enum: [low, medium, high]}
        total: {$ref: "#/components/schemas/ReportEvalRates"}
        by_label:
          type: object
          description: Por etiqueta esperada (verdadero, exagerado, falso)
          additionalProperties: {$ref: "#/components/schemas/ReportEvalRates"}
        by_class:
          type: object
          description: Por clase de la especificación (coherente, dificil, exagerado, falso)
          additionalProperties: {$ref: "#/components/schemas/ReportEvalRates"}
        matrix:
          type: object
          description: Etiqueta esperada → categoría obtenida (coincide, parcial, no_coincide, revision_humana) → reportes
          additionalProperties:
            type: object
            additionalProperties: {type: integer, minimum: 0}
    ReportVerificationEval:
      type: object
      required: [model, evaluated_on, reports, labels_from, texts_from, runs]
      properties:
        model: {type: string}
        evaluated_on: {type: string, format: date}
        reports: {type: integer, minimum: 1}
        labels_from: {type: string}
        texts_from: {type: string}
        runs:
          type: array
          items: {$ref: "#/components/schemas/ReportEvalRun"}
