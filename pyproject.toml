[project]
name = "climapp"
version = "0.1.0"
description = "Pronóstico de lluvia ≥20 mm en la cuenca del río Pance con reportes ciudadanos verificados. No es una alerta oficial."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "xlrd>=2.0.1",
    "openpyxl>=3.1",
    "scikit-learn>=1.9.1",
    "numpy>=2.5.4",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "openai>=3.42.0",
]

[project.scripts]
climapp-daily = "climapp.data.cli:main"
climapp-train = "climapp.forecast.cli:main"
climapp-groups = "climapp.data.groups:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "xlwt>=1.3.0",
    "types-openpyxl>=3.1.5.20261017",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261030",
    "types-jsonschema>=4.26.0.20261006",
    "hypothesis>=6.170.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["climapp"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "S", "T20", "C90", "SIM", "RUF", "PL"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# S311: los tests generan series sintéticas con random, no secretos
"tests/**" = ["S101", "PLR2004", "S311"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["xlrd", "xlrd.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
