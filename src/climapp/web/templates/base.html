<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ClimApp Lite{% endblock %}</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
  <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body>
  <div class="aviso" role="note">
    <strong>No es una alerta oficial.</strong> Pronóstico experimental. Ante cualquier riesgo, sigue a
    {% if official_url %}<a href="{{ official_url }}" rel="noopener">Gestión del Riesgo de Cali</a> y {% endif %}<a href="{{ ideam_url }}" rel="noopener">IDEAM: pronósticos y alertas</a>.
  </div>
  {% block body %}{% endblock %}
</body>
</html>
